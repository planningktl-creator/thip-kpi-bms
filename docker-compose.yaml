services:
  thip-kpi-bms:
    build:
      context: .
      args:
        BMS_ALLOWED_ORIGINS: "${BMS_ALLOWED_ORIGINS:-https://hosxp.net}"
        VITE_BASE_PATH: "/"
    container_name: thip-kpi-bms
    ports:
      - "3082:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /var/run:uid=101,gid=101,mode=755
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
